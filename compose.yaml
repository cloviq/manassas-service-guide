name: manassas-service-guide
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in backend/dev.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/dev.env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in backend/dev.env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  opensearch:
    image: opensearchproject/opensearch:2.19.4
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - search_data:/usr/share/opensearch/data
    mem_limit: 2g
    cpus: 1.0
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=3s' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
  embeddings:
    build: ./embeddings
    environment:
      BIND_HOST: 0.0.0.0
    volumes:
      - model_cache:/app/.cache
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3002/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 120s
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:?required}:${POSTGRES_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:?required}
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_INDEX: manassas-catalog
      EMBEDDING_URL: http://embeddings:3002/v1/embeddings
      EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
      EMBEDDING_DIMENSION: "384"
      EMBEDDING_BATCH_SIZE: "16"
      BIND_HOST: 0.0.0.0
      PORT: "3001"
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      embeddings:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/healthz"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:5174:80"
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 64m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  pg_data:
  search_data:
  model_cache:
