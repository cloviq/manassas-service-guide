# Sign-in and roles are enforced by the API (cookie sessions); the static SPA
# bundle holds no data. The login limit caps password guessing per client
# address (traffic forwarded by Docker may share one address), not normal use.
limit_req_zone $binary_remote_addr zone=login:1m rate=20r/m;
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 16k;
    location = /health { access_log off; return 200 'ok'; }
    location = /api/auth/login {
        limit_req zone=login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
    location /api/ {
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
    # The learning page has public-source content, but keeps the guide's sign-in
    # boundary. Once signed in, its content and exercise need no JavaScript.
    location = /waste-collection.html {
        auth_request /_waste_auth;
        error_page 401 = @waste_sign_in;
        add_header Cache-Control "private, no-store" always;
        try_files $uri =404;
    }
    location @waste_sign_in {
        absolute_redirect off;
        add_header Cache-Control "private, no-store" always;
        return 302 /;
    }
    location = /_waste_auth {
        internal;
        proxy_pass http://api:3001/api/auth/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / { try_files $uri $uri/ /index.html; }
}
